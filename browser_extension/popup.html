<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnyFileDownloader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <label for="download-url">URL to download</label>
      <input id="download-url" type="url" placeholder="https://example.com/media" autofocus>
      <button id="send-download" type="button">Send to desktop app</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
