<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnyFileDownloader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <strong>Detected media</strong>
        <span id="native-status" class="status">Checking native host…</span>
      </header>

      <label for="candidate-list">Media found in this tab</label>
      <select id="candidate-list" size="6" aria-describedby="candidate-help"></select>
      <p id="candidate-help" class="hint">Open or play media on the page if this list is empty.</p>
      <details>
        <summary>Selected candidate details</summary>
        <pre id="candidate-debug">No candidate selected.</pre>
      </details>
      <button id="download-selected" type="button">Download selected media</button>

      <section>
        <label for="manual-url">Manual/test URL</label>
        <input id="manual-url" type="url" placeholder="https://example.com/media.m3u8">
        <button id="download-manual" class="secondary" type="button">Send manual URL</button>
      </section>

      <p id="request-status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="media_detection.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
