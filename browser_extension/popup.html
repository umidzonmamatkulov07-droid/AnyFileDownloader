<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnyFileDownloader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <strong>Detected downloads</strong>
        <span id="native-status" class="status">Checking native host…</span>
      </header>

      <div class="list-heading">Files and media found in this tab</div>
      <div id="candidate-list" role="list" aria-describedby="candidate-help"></div>
      <p id="candidate-help" class="hint">Open content or follow file links on the page if this list is empty.</p>
      <details>
        <summary>Candidate details</summary>
        <pre id="candidate-debug">No candidate selected.</pre>
      </details>

      <label class="setting-toggle" for="show-inline-buttons">
        <input id="show-inline-buttons" type="checkbox" checked>
        <span>Show in-page download buttons</span>
      </label>

      <section>
        <label for="manual-url">Manual URL</label>
        <input id="manual-url" type="url" placeholder="https://example.com/file.pdf">
        <button id="download-manual" class="secondary" type="button">Download URL</button>
      </section>

      <p id="request-status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="media_detection.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
